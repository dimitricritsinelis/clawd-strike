<text class="tiny" x="1100" y="678">3 storeys; see section for floor datums</text>
<text class="tiny" x="1100" y="696">Upper opening groups balance the complete</text>
<text class="tiny" x="1100" y="714">visible facade or established composition.</text>
<text class="tiny" x="1100" y="732">Ground doors and shop axes remain independent.</text>
<text class="tiny" x="1100" y="750">Existing shared physical room identities and</text>
<text class="tiny" x="1100" y="768">floor levels are retained.</text>
<text class="tiny" x="1100" y="786">Ground trade bays and staff stairs use</text>
<text class="tiny" x="1100" y="804">different widths because they have different</text>
<text class="tiny" x="1100" y="822">functions; residential principal elevations use</text>
<text class="tiny" x="1100" y="840">a centered entrance. No free offsets or filler</text>
