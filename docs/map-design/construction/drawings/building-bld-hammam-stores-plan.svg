<text class="label" x="1100" y="630">BUILDING ORDER</text>
<text class="tiny" x="1100" y="660">Hammam linen store</text>
<text class="tiny" x="1100" y="678">3 storeys; see section for floor datums</text>
<text class="tiny" x="1100" y="696">Use ground frontage piers separately from</text>
<text class="tiny" x="1100" y="714">floor-specific upper room and framing axes.</text>
<text class="tiny" x="1100" y="732">Corresponding openings serving one room share</text>
<text class="tiny" x="1100" y="750">its canonical ID where the room spans opposite</text>
<text class="tiny" x="1100" y="768">faces. A different front/rear axis must have a</text>
<text class="tiny" x="1100" y="786">stated room-use relationship.</text>
<text class="tiny" x="1100" y="804">Ground trade bays and staff stairs use</text>
<text class="tiny" x="1100" y="822">different widths because they have different</text>
<text class="tiny" x="1100" y="840">functions; residential principal elevations use</text>
<text class="tiny" x="1100" y="858">a centered entrance. No free offsets or filler</text>
<text class="tiny" x="1100" y="876">openings.</text>
