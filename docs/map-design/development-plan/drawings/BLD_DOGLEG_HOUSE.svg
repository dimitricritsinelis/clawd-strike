/><line x1="81.0" y1="618" x2="89.0" y2="628" stroke="#52676a" stroke-width="1"/><line x1="761.0" y1="618" x2="769.0" y2="628" stroke="#52676a" stroke-width="1"/><text x="425.00" y="617.00" font-family="Arial,sans-serif" font-size="15" fill="#52676a" font-weight="normal" text-anchor="middle">14.000 m</text><line x1="75" y1="600" x2="775.0" y2="600" stroke="#263f44" stroke-width="1.5"/><text x="1030.00" y="243.00" font-family="Arial,sans-serif" font-size="13" fill="#52676a" font-weight="normal" text-anchor="end">z floor 0.00 / plotted max 7.000</text>
<text x="1090.00" y="220.00" font-family="Arial,sans-serif" font-size="18" fill="#263f44" font-weight="bold" text-anchor="start">02 / CONTEXT PLAN + ROOF FOOTPRINTS</text><rect x="1105" y="285" width="140" height="280" fill="#dce7d9" stroke="#263f44" stroke-width="1.5"/><text x="1125.00" y="445.00" font-family="Arial,sans-serif" font-size="15" fill="#263f44" font-weight="normal" text-anchor="start">DOGLEG 7 x14</text><rect x="1245" y="285" width="84.0" height="280" fill="none" stroke="#b15d37" stroke-width="2"/><line x1="1245" y1="285" x2="1329.0" y2="285" stroke="#b15d37" stroke-width="2" stroke-dasharray="5 4"/><text x="1425.00" y="315.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">Implied building</text><text x="1425.00" y="338.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">depth4.2. Boundary</text><text x="1425.00" y="361.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">remains sealed.</text><text x="1425.00" y="384.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">Hidden volume is</text><text x="1425.00" y="407.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">explanatory, not a</text><text x="1425.00" y="430.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">new runtime</text><text x="1425.00" y="453.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">footprint. M04 owns</text><text x="1425.00" y="476.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">the west gate frame</text><text x="1425.00" y="499.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">measurement.</text><text x="1110.00" y="631.00" font-family="Arial,sans-serif" font-size="14" fill="#263f44" font-weight="normal" text-anchor="start">y48..62 / east face x53 / west face x46</text>
<text x="55.00" y="690.00" font-family="Arial,sans-serif" font-size="18" fill="#263f44" font-weight="bold" text-anchor="start">03 / END PROFILE</text><rect x="85" y="730.0" width="13.249999999999998" height="265.0" fill="#eee8db" stroke="#263f44" stroke-width="1.6"/><line x1="85" y1="1018" x2="98.25" y2="1018" stroke="#52676a" stroke-width="1"/><line x1="81" y1="1013" x2="89" y2="1023" stroke="#52676a" stroke-width="1"/><line x1="94.25" y1="1013" x2="102.25" y2="1023" stroke="#52676a" stroke-width="1"/><text x="91.62" y="1012.00" font-family="Arial,sans-serif" font-size="15" fill="#52676a" font-weight="normal" text-anchor="middle">0.350 m</text><line x1="75" y1="995" x2="108.25" y2="995" stroke="#263f44" stroke-width="1.5"/><text x="420.00" y="713.00" font-family="Arial,sans-serif" font-size="13" fill="#52676a" font-weight="normal" text-anchor="end">z floor 0.00 / plotted max 7.000</text>

<text x="455.00" y="725.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="bold" text-anchor="start">REAR / EXPOSED PARTY WALL</text>
<text x="455.00" y="755.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">Retain useful source high</text><text x="455.00" y="779.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">closures and supported</text><text x="455.00" y="803.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">projections on inhabited faces.</text><text x="455.00" y="827.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">Enclosure backs stay quiet.</text><text x="455.00" y="851.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">Hidden shared surfaces get no</text><text x="455.00" y="875.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">second mesh. Context plan</text><text x="455.00" y="899.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">distinguishes relief from full</text><text x="455.00" y="923.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">volume.</text>
<text x="455.00" y="1010.00" font-family="Arial,sans-serif" font-size="14" fill="#397c78" font-weight="normal" text-anchor="start">No automatic blank-face deletion.</text>
<text x="885.00" y="700.00" font-family="Arial,sans-serif" font-size="18" fill="#b15d37" font-weight="bold" text-anchor="start">RELIEF ON IMPLIED OFF-MAP HOUSE</text>
<text x="885.00" y="735.00" font-family="Arial,sans-serif" font-size="18" fill="#263f44" font-weight="normal" text-anchor="start">Source boundary face, not a0.35 m-deep dwelling. Dashed volume</text><text x="885.00" y="760.00" font-family="Arial,sans-serif" font-size="18" fill="#263f44" font-weight="normal" text-anchor="start">extends x53..57.2,y48..62 for access explanation only. No new</text><text x="885.00" y="785.00" font-family="Arial,sans-serif" font-size="18" fill="#263f44" font-weight="normal" text-anchor="start">footprint/doorway opens the boundary. M05/M06 measure the actual</text><text x="885.00" y="810.00" font-family="Arial,sans-serif" font-size="18" fill="#263f44" font-weight="normal" text-anchor="start">dogleg and north turn.</text>
<text x="55.00" y="1080.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="bold" text-anchor="start">MOUNTING / APPROVAL</text>
<text x="300.00" y="1080.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">Opening shapes are schematic; retained repaired frames are not redesigned. Source roof boxes are a static survey, not a live scene</text><text x="300.00" y="1101.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">or clearance pass. Dimensions and relationships: buildings.md; assemblies/export bounds: assets.md.</text>
