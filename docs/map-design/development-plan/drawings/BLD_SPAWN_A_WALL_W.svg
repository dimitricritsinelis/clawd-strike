<text x="1090.00" y="220.00" font-family="Arial,sans-serif" font-size="19" fill="#263f44" font-weight="bold" text-anchor="start">02 / PLAN + ROOF OWNERSHIP</text><rect x="1190.4545454545455" y="386.0909090909091" width="334.09090909090907" height="190.9090909090909" fill="#dedacb" stroke="#263f44" stroke-width="1.5"/><line x1="1190.4545454545455" y1="577" x2="1524.5454545454545" y2="577" stroke="#397c78" stroke-width="4"/><line x1="1290.6818181818182" y1="577" x2="1491.1363636363637" y2="577" stroke="#8d6950" stroke-width="7"/><line x1="1190.4545454545455" y1="599" x2="1524.5454545454545" y2="599" stroke="#52676a" stroke-width="1"/><line x1="1186.4545454545455" y1="594" x2="1194.4545454545455" y2="604" stroke="#52676a" stroke-width="1"/><line x1="1520.5454545454545" y1="594" x2="1528.5454545454545" y2="604" stroke="#52676a" stroke-width="1"/><text x="1357.50" y="593.00" font-family="Arial,sans-serif" font-size="15" fill="#52676a" font-weight="normal" text-anchor="middle">3.500</text><text x="1620.00" y="251.00" font-family="Arial,sans-serif" font-size="15" fill="#263f44" font-weight="normal" text-anchor="end">D 2 m</text><text x="1357.50" y="625.00" font-family="Arial,sans-serif" font-size="14" fill="#397c78" font-weight="normal" text-anchor="middle">ROUTE / keep existing body envelope</text><text x="1100.00" y="270.00" font-family="Arial,sans-serif" font-size="14" fill="#52676a" font-weight="normal" text-anchor="start">Solid fill = retained nontraversable volume.</text><text x="1100.00" y="291.00" font-family="Arial,sans-serif" font-size="14" fill="#52676a" font-weight="normal" text-anchor="start">Dashed inset = existing roof setback.</text>
