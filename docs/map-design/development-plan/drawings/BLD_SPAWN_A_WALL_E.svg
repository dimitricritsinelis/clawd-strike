<text x="455.00" y="725.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="bold" text-anchor="start">REAR / EXPOSED PARTY WALL</text>
<text x="455.00" y="755.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">Retain useful source high</text><text x="455.00" y="779.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">closures and supported</text><text x="455.00" y="803.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">projections on inhabited faces.</text><text x="455.00" y="827.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">Enclosure backs stay quiet.</text><text x="455.00" y="851.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">Hidden shared surfaces get no</text><text x="455.00" y="875.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">second mesh. Context plan</text><text x="455.00" y="899.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">distinguishes relief from full</text><text x="455.00" y="923.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="normal" text-anchor="start">volume.</text>
<text x="455.00" y="1010.00" font-family="Arial,sans-serif" font-size="14" fill="#397c78" font-weight="normal" text-anchor="start">No automatic blank-face deletion.</text>
<text x="885.00" y="700.00" font-family="Arial,sans-serif" font-size="18" fill="#b15d37" font-weight="bold" text-anchor="start">RETAIN VISIBLE KIT / SUPPORT DISTINCT</text>
<text x="885.00" y="735.00" font-family="Arial,sans-serif" font-size="18" fill="#263f44" font-weight="normal" text-anchor="start">Visible kit5.5×2×7.6; support shell4.62×0.96×4.9. Source anchor</text><text x="885.00" y="760.00" font-family="Arial,sans-serif" font-size="18" fill="#263f44" font-weight="normal" text-anchor="start">owns exact transform. Keep complete return kit and attached Spice</text><text x="885.00" y="785.00" font-family="Arial,sans-serif" font-size="18" fill="#263f44" font-weight="normal" text-anchor="start">block. No duplicate skin or new booth. M05 checks full body sweep.</text>
<text x="55.00" y="1080.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="bold" text-anchor="start">MOUNTING / APPROVAL</text>
<text x="300.00" y="1080.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">Opening shapes are schematic; retained repaired frames are not redesigned. Source roof boxes are a static survey, not a live scene</text><text x="300.00" y="1101.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">or clearance pass. Dimensions and relationships: buildings.md; assemblies/export bounds: assets.md.</text>
