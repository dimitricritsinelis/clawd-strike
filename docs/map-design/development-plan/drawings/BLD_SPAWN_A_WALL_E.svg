<text x="55.00" y="960.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="bold" text-anchor="start">DRAWING NOTES</text>
<text x="55.00" y="986.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">Source envelope dimensions are observed; bay counts and datums follow the proposed card. These</text><text x="55.00" y="1007.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">are visual-design elevations, not new floor plans or structural engineering. Existing skyline</text><text x="55.00" y="1028.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">fixtures, roof geometry and collision remain source-owned.</text>
<text x="55.00" y="1054.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">End views repeat once per wing; lengths above are the owning massing depth. Named attached</text><text x="55.00" y="1075.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">frontages take precedence over quiet faces. No automatic return windows, fake doors, balcony or</text><text x="55.00" y="1096.00" font-family="Arial,sans-serif" font-size="16" fill="#263f44" font-weight="normal" text-anchor="start">additional route.</text>
<text x="970.00" y="960.00" font-family="Arial,sans-serif" font-size="17" fill="#263f44" font-weight="bold" text-anchor="start">SETTING OUT / LOCAL FLOOR DATUM</text>
