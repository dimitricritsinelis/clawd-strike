<text x="1065" y="975" font-family="Arial" font-size="16" fill="#263f44" font-weight="normal">Pocket is a requested usable-depth test behind</text><text x="1065" y="998" font-family="Arial" font-size="16" fill="#263f44" font-weight="normal">closed backing. If it cannot fit, use front-served</text><text x="1065" y="1021" font-family="Arial" font-size="16" fill="#263f44" font-weight="normal">locked display; no deeper shell or collider move.</text>
<text x="55" y="1057" font-family="Arial" font-size="16" fill="#263f44" font-weight="normal">B18 full pilot includes packing01, original</text><text x="55" y="1080" font-family="Arial" font-size="16" fill="#263f44" font-weight="normal">booth02, samples03, roof, end walls, supported</text><text x="55" y="1103" font-family="Arial" font-size="16" fill="#263f44" font-weight="normal">awnings and ground contact. Three arches stay</text><text x="55" y="1126" font-family="Arial" font-size="16" fill="#263f44" font-weight="normal">repaired.</text>
