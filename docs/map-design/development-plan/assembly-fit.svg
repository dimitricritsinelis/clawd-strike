<text x="55" y="146" font-family="Arial" font-size="17" fill="#263f44" font-weight="normal">Measured source bounds are labeled. Hidden access pockets are explanations, not modeled or playable interiors.</text>
<text x="55" y="195" font-family="Arial" font-size="19" fill="#397c78" font-weight="bold">01 / CENTRAL BLOCK: TWO PUBLIC FACES</text>
