<text x="75" y="975" font-size="19" fill="#293d42" font-weight="normal" text-anchor="start">T0: Souk east GROUND_02 stays untouched. T1: Textile east GROUND_01. D1: Souk east dye counter.</text>
<text x="75" y="1007" font-size="19" fill="#293d42" font-weight="normal" text-anchor="start">At T1, remove the old counter/stock/grille/bay-awning visuals; retain arch, backing and threshold.</text>
