<text x="544" y="818" font-family="Arial" font-size="17" fill="#263f44" font-weight="normal">Depth -0.395..+0.896 from origin</text>
<text x="535" y="858" font-family="Arial" font-size="17" fill="#263f44" font-weight="normal">Low bound below2.5: |X|≤0.93, front≤0.29 is a</text><text x="535" y="882" font-family="Arial" font-size="17" fill="#263f44" font-weight="normal">source assertion, not clearance approval. M02</text><text x="535" y="906" font-family="Arial" font-size="17" fill="#263f44" font-weight="normal">samples arch spring, ledger, brace seats and all</text><text x="535" y="930" font-family="Arial" font-size="17" fill="#263f44" font-weight="normal">body sweeps. Original asset remains unchanged.</text>
<text x="548" y="1052" font-family="Arial" font-size="17" fill="#397c78" font-weight="normal">38,820 triangles /1 primitive /1 material</text>
