<text x="148" y="446" font-family="Arial" font-size="18" fill="#263f44" font-weight="normal">5 m ×5 m</text>
<text x="69" y="772" font-family="Arial" font-size="17" fill="#263f44" font-weight="normal">West x36..40.8 / east x36.2..41</text>
<text x="69" y="800" font-family="Arial" font-size="17" fill="#263f44" font-weight="normal">Overlap4.60 / strips0.20 each</text>
<text x="55" y="840" font-family="Arial" font-size="17" fill="#263f44" font-weight="normal">Souk massing owns common backing and roof in</text><text x="55" y="864" font-family="Arial" font-size="17" fill="#263f44" font-weight="normal">each wing. Court keeps its face modules. No</text><text x="55" y="888" font-family="Arial" font-size="17" fill="#263f44" font-weight="normal">bridge across the open link; no pair of full</text><text x="55" y="912" font-family="Arial" font-size="17" fill="#263f44" font-weight="normal">intersecting building exports. North access</text><text x="55" y="936" font-family="Arial" font-size="17" fill="#263f44" font-weight="normal">serves north wing only.</text>
<text x="535" y="195" font-family="Arial" font-size="19" fill="#397c78" font-weight="bold">02 / ACTUAL BOOTH ENVELOPE</text>
