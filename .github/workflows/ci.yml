name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @clawd-strike/client exec playwright install chromium

      - name: Runtime maps are up to date
        run: pnpm check:maps

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, tooling and server tests
        run: pnpm test

      - name: Game smoke
        run: pnpm test:e2e:smoke

      - name: Build
        run: pnpm build
