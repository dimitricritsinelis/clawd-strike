# Generated by the Clawd Strike game repo export flow.
name: Public Agent Smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  smoke-no-context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
        # playwright is a devDependency of @clawd-strike/client, not of the
        # workspace root, so `pnpm exec` here resolves nothing and the job dies
        # with `Command "playwright" not found`. ci.yml already scopes this
        # correctly with --filter.
      - run: pnpm --filter @clawd-strike/client exec playwright install --with-deps chromium
      - run: pnpm smoke:no-context
        env:
          BASE_URL: https://clawd-strike.vercel.app/
