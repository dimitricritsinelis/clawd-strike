name: Linux render-loop diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: [3ec5d36e121523dfc9871435184ad58ce5c0b93a, 9cc6a44757757ca03de05f9c33da5ed10b50c78c]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @clawd-strike/client exec playwright install --with-deps chromium
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.source }}
          path: comparison-src
      - name: Same dependencies and browser, isolated source/server
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" comparison-src/node_modules
          ln -s "$GITHUB_WORKSPACE/apps/client/node_modules" comparison-src/apps/client/node_modules
          mkdir -p artifacts/render-loop-diagnosis
          pnpm --dir comparison-src --filter @clawd-strike/client dev --host 127.0.0.1 --port 4173 --strictPort > artifacts/render-loop-diagnosis/vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
      - name: Mobile real-time comparison and process sampling
        env:
          DIAGNOSTIC_SOURCE: ${{ matrix.source }}
        run: |
          node apps/client/scripts/diagnose-render-loop.mjs &
          diagnostic_pid=$!
          while kill -0 "$diagnostic_pid" 2>/dev/null; do
            date -u >> artifacts/render-loop-diagnosis/process-cpu.log
            ps -eo pid,ppid,pcpu,pmem,state,etime,comm | awk 'NR == 1 || /chrome|chromium|node/' >> artifacts/render-loop-diagnosis/process-cpu.log
            sleep 5
          done
          wait "$diagnostic_pid"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-loop-${{ matrix.source }}
          path: artifacts/render-loop-diagnosis/
          retention-days: 7
